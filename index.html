<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Air Hockey Duel</title>
<style>
/* Layout: one portrait rink fills the screen; each player owns one half and plays with a thumb. */
:root {
  --bg: #080d1a;
  --rink: #0e1a33;
  --line: #2b4f86;
  --top: #ff5a87;
  --bottom: #3fe3c8;
  --puck: #f5f8ff;
  --fg: #eaf0ff;
  --muted: #8ea2c8;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
canvas { display: block; touch-action: none; border-radius: 14px; }
.overlay {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 24px;
  background: rgba(8, 13, 26, 0.86);
  text-align: center;
}
.overlay[hidden] { display: none; }
.overlay h1 {
  margin: 0; font-size: clamp(2.2rem, 11vw, 3.6rem); letter-spacing: 0.06em;
  text-transform: uppercase; font-weight: 800; text-wrap: balance;
}
.overlay h1 span:first-child { color: var(--top); }
.overlay h1 span:last-child { color: var(--bottom); }
.overlay p { margin: 0; color: var(--muted); max-width: 28ch; line-height: 1.45; }
.flip { transform: rotate(180deg); }
.speed { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.speed span { color: var(--muted); font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; width: 100%; }
.speed button {
  font-size: 0.95rem; padding: 10px 18px; box-shadow: none;
  background: transparent; color: var(--fg); border: 2px solid var(--line);
}
.speed button.small { font-size: 0.85rem; padding: 9px 14px; }
.speed button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button {
  font: inherit; font-weight: 700; font-size: 1.2rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--bg); background: var(--bottom);
  border: 0; border-radius: 999px; padding: 16px 44px;
  box-shadow: 0 0 28px rgba(63, 227, 200, 0.45);
}
button:active { transform: scale(0.96); }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="c" aria-label="Terrain d'air hockey"></canvas>
<div class="overlay" id="menu"></div>
<script>
(() => {
  const W = 400, H = 700;          // logical rink size
  const PUCK_R = 17, PAD_R = 32;   // radii
  const GOAL_HALF = 72;            // half width of each goal opening
  const WIN = 7;
  const SUB = 4;                   // physics substeps per frame
  const MAX_V = 11;                // px per substep
  const C = { bg: '#0e1a33', line: '#2b4f86', top: '#ff5a87', bottom: '#3fe3c8', puck: '#f5f8ff' };

  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const menu = document.getElementById('menu');
  let scale = 1;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    scale = Math.min(innerWidth / W, innerHeight / H);
    cv.style.width = W * scale + 'px';
    cv.style.height = H * scale + 'px';
    cv.width = Math.round(W * scale * dpr);
    cv.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  addEventListener('resize', resize);
  resize();

  // players: 0 = top (pink), 1 = bottom (teal)
  const pads = [
    { x: W / 2, y: 120, tx: W / 2, ty: 120, vx: 0, vy: 0 },
    { x: W / 2, y: H - 120, tx: W / 2, ty: H - 120, vx: 0, vy: 0 },
  ];
  const puck = { x: W / 2, y: H / 2, vx: 0, vy: 0 };
  const score = [0, 0];
  let state = 'menu';   // menu | playing | goal | over
  let stateT = 0;
  let lastScorer = -1;
  let flash = 0;
  let wake = null;
  let speedMul = 0.65;
  let wantFull = true, mode = 'cpu', diff = 'medium';
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); } catch (_) {} },
  };
  wantFull = store.get('ah-full') !== '0';
  speedMul = parseFloat(store.get('ah-speed2')) || 0.65;
  if (store.get('ah-mode') === '2p') mode = '2p';
  if (['easy', 'medium', 'hard'].includes(store.get('ah-diff'))) diff = store.get('ah-diff');
  const root = document.documentElement;
  const reqFS = root.requestFullscreen || root.webkitRequestFullscreen;
  function goFull() {
    if (!wantFull || !reqFS || document.fullscreenElement || document.webkitFullscreenElement) return;
    try { const r = reqFS.call(root); if (r && r.catch) r.catch(() => {}); } catch (_) {}
  }

  const btn = (attr, val, label) => '<button type="button" class="small" data-' + attr + '="' + val + '">' + label + '</button>';
  function settingsHTML() {
    return '<div class="speed"><span>Mode</span>' + btn('mode', 'cpu', "Contre l'ordinateur") + btn('mode', '2p', '2 joueurs') + '</div>' +
      '<div class="speed" data-for="cpu"><span>Difficulté</span>' + btn('diff', 'easy', 'Facile') + btn('diff', 'medium', 'Moyen') + btn('diff', 'hard', 'Difficile') + '</div>' +
      '<div class="speed"><span>Vitesse du palet</span>' + btn('speed', '0.4', 'Lent') + btn('speed', '0.65', 'Normal') + btn('speed', '1', 'Rapide') + btn('speed', '1.45', 'Turbo') + '</div>' +
      (reqFS ? '<div class="speed"><button type="button" class="small" data-full="1"></button></div>' : '');
  }
  function renderMenu(winner) {
    const startLabel = winner === undefined ? 'Jouer' : 'Rejouer';
    let head;
    if (winner === undefined) {
      head = '<p class="flip" data-for="2p">Joueur du haut<br>glisse ton doigt dans ta moitié</p>' +
        '<h1><span>Air</span> <span>Hockey</span></h1>' +
        '<p>Le premier à ' + WIN + ' buts gagne.</p>';
    } else {
      const col = winner === 0 ? 'var(--top)' : 'var(--bottom)';
      const title = mode === 'cpu' ? (winner === 1 ? 'Tu as<br>gagné !' : "L'ordinateur<br>gagne") : 'Victoire<br>' + (winner === 0 ? 'rose' : 'turquoise');
      head = '<p class="flip" data-for="2p">' + (winner === 0 ? 'Bravo !' : 'Dommage !') + '</p>' +
        '<h1 style="color:' + col + '">' + title + '</h1><p>' + score[0] + ' – ' + score[1] + '</p>';
    }
    const foot = winner === undefined
      ? '<p data-for="2p">Joueur du bas<br>glisse ton doigt dans ta moitié</p><p data-for="cpu">Tu joues en bas.<br>Glisse ton doigt pour bouger ton palet.</p>'
      : '<p data-for="2p">' + (winner === 1 ? 'Bravo !' : 'Dommage !') + '</p>';
    menu.innerHTML = head + settingsHTML() + '<button type="button" data-start="1">' + startLabel + '</button>' + foot;
    markSettings();
  }
  function markSettings() {
    const on = (sel, v) => menu.querySelectorAll(sel).forEach((b) => b.classList.toggle('on', v(b)));
    on('[data-speed]', (b) => parseFloat(b.dataset.speed) === speedMul);
    on('[data-mode]', (b) => b.dataset.mode === mode);
    on('[data-diff]', (b) => b.dataset.diff === diff);
    menu.querySelectorAll('[data-full]').forEach((b) => {
      b.textContent = 'Plein écran : ' + (wantFull ? 'oui' : 'non');
      b.classList.toggle('on', wantFull);
    });
    menu.querySelectorAll('[data-for]').forEach((el) => { el.hidden = el.dataset.for !== mode; });
  }
  menu.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const d = b.dataset;
    if (d.speed) { speedMul = parseFloat(d.speed); store.set('ah-speed2', speedMul); }
    else if (d.mode) { mode = d.mode; store.set('ah-mode', mode); }
    else if (d.diff) { diff = d.diff; store.set('ah-diff', diff); }
    else if (d.full) { wantFull = !wantFull; store.set('ah-full', wantFull ? 1 : 0); }
    else if (d.start) { startGame(); return; }
    markSettings();
  });

  // ---- sound (created on first tap, required by iOS) ----
  let ac = null;
  function beep(freq, dur, type = 'sine', gain = 0.15) {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  }
  let lastHit = 0;
  function hitSound(strength, freq) {
    const now = performance.now();
    if (now - lastHit < 40) return;
    lastHit = now;
    beep(freq, 0.08, 'triangle', Math.min(0.25, 0.04 + strength * 0.012));
  }

  // ---- input: one pointer per player, assigned by the half touched first ----
  const owners = new Map(); // pointerId -> player
  function pos(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
  }
  function setTarget(p, x, y) {
    const pd = pads[p];
    pd.tx = Math.max(PAD_R, Math.min(W - PAD_R, x));
    const lo = p === 0 ? PAD_R : H / 2 + PAD_R;
    const hi = p === 0 ? H / 2 - PAD_R : H - PAD_R;
    pd.ty = Math.max(lo, Math.min(hi, y));
  }
  cv.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const { x, y } = pos(e);
    const p = mode === 'cpu' ? 1 : y < H / 2 ? 0 : 1;
    for (const v of owners.values()) if (v === p) return;
    owners.set(e.pointerId, p);
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    setTarget(p, x, y);
  });
  cv.addEventListener('pointermove', (e) => {
    const p = owners.get(e.pointerId);
    if (p === undefined) return;
    e.preventDefault();
    const { x, y } = pos(e);
    setTarget(p, x, y);
  });
  const release = (e) => owners.delete(e.pointerId);
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  // ---- game flow ----
  function serve(toward) {
    puck.x = W / 2;
    puck.y = toward === 0 ? H / 2 - 90 : toward === 1 ? H / 2 + 90 : H / 2;
    puck.vx = 0; puck.vy = 0;
  }
  function newGame() {
    score[0] = score[1] = 0;
    pads[0].x = pads[0].tx = W / 2; pads[0].y = pads[0].ty = 120;
    pads[1].x = pads[1].tx = W / 2; pads[1].y = pads[1].ty = H - 120;
    serve(-1);
    state = 'playing';
    menu.hidden = true;
    try {
      if (navigator.wakeLock) navigator.wakeLock.request('screen').then((w) => { wake = w; }).catch(() => {});
    } catch (_) {}
  }
  function startGame() {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {}
    }
    if (ac && ac.state === 'suspended') ac.resume();
    goFull();
    newGame();
  }

  function goal(scorer) {
    score[scorer]++;
    lastScorer = scorer;
    flash = 1;
    stateT = 0;
    beep(520, 0.15, 'square', 0.1);
    setTimeout(() => beep(780, 0.25, 'square', 0.1), 130);
    if (score[scorer] >= WIN) {
      state = 'over';
      renderMenu(scorer);
      setTimeout(() => { menu.hidden = false; }, 900);
    } else {
      state = 'goal';
    }
  }

  // ---- computer opponent (plays the top paddle) ----
  const AI = {
    easy:   { speed: 4,  err: 40, still: 2.5 },
    medium: { speed: 7,  err: 16, still: 4 },
    hard:   { speed: 12, err: 4,  still: 6 },
  };
  let aiErr = 0, aiErrT = 0;
  function predictX(y) {
    if (puck.vy >= -0.2) return null;
    const t = (y - puck.y) / puck.vy;
    if (t < 0) return null;
    const span = W - 2 * PUCK_R;
    let u = (puck.x + puck.vx * t - PUCK_R) % (2 * span);
    if (u < 0) u += 2 * span;
    if (u > span) u = 2 * span - u;
    return u + PUCK_R;
  }
  function aiUpdate(dt) {
    const L = AI[diff], p = pads[0], homeY = 95;
    aiErrT -= dt;
    if (aiErrT <= 0) { aiErr = (Math.random() * 2 - 1) * L.err; aiErrT = 25 + Math.random() * 30; }
    const inMyHalf = puck.y < H / 2 + 15;
    const calm = Math.hypot(puck.vx, puck.vy) < L.still || puck.vy > 0;
    let tx, ty;
    if (inMyHalf && calm) {
      // get behind the puck, then drive it toward the opponent's goal
      let dx = W / 2 + aiErr * 0.5 - puck.x, dy = H - puck.y;
      const dl = Math.hypot(dx, dy) || 1; dx /= dl; dy /= dl;
      const gap = PAD_R + PUCK_R + 4;
      const bx = puck.x - dx * gap, by = puck.y - dy * gap;
      const dBehind = Math.hypot(bx - p.x, by - p.y);
      if (p.y > puck.y - 6 && dBehind > 30) {
        tx = puck.x + (p.x < puck.x ? -1 : 1) * (gap + 22);
        ty = Math.max(30, puck.y - 40);
      } else if (dBehind > 18) { tx = bx; ty = by; }
      else { tx = puck.x + dx * 30; ty = puck.y + dy * 30; }
    } else {
      const px = diff === 'easy' ? null : predictX(homeY);
      tx = (px !== null ? px : puck.x * 0.8 + W / 4) + aiErr;
      ty = homeY;
    }
    const lim = L.speed * dt * Math.max(0.6, Math.min(2, speedMul / 0.65));
    const ddx = tx - p.tx, ddy = ty - p.ty, dd = Math.hypot(ddx, ddy);
    const f = dd > lim ? lim / dd : 1;
    setTarget(0, p.tx + ddx * f, p.ty + ddy * f);
  }

  // ---- physics ----
  function step(frameDt) {
    const dt = frameDt * speedMul;
    // paddles glide toward their targets; velocity feeds the hit
    for (const p of pads) {
      p.vx = (p.tx - p.x) / SUB;
      p.vy = (p.ty - p.y) / SUB;
    }
    for (let i = 0; i < SUB; i++) {
      for (const p of pads) { p.x += p.vx; p.y += p.vy; }
      puck.x += puck.vx * dt; puck.y += puck.vy * dt;

      // paddle collisions
      for (let k = 0; k < 2; k++) {
        const p = pads[k];
        let dx = puck.x - p.x, dy = puck.y - p.y;
        let d = Math.hypot(dx, dy);
        const min = PUCK_R + PAD_R;
        if (d < min) {
          if (d < 0.001) { dx = 0; dy = k === 0 ? 1 : -1; d = 1; }
          const nx = dx / d, ny = dy / d;
          puck.x = p.x + nx * min;
          puck.y = p.y + ny * min;
          const pvx = p.vx / frameDt, pvy = p.vy / frameDt;  // paddle speed in world units, so the speed setting scales every hit
          const rvx = puck.vx - pvx, rvy = puck.vy - pvy;
          const vn = rvx * nx + rvy * ny;
          if (vn < 0) {
            const j = -(1 + 0.92) * vn;
            puck.vx = rvx + j * nx + pvx;
            puck.vy = rvy + j * ny + pvy;
            hitSound(-vn, k === 0 ? 330 : 440);
          }
        }
      }

      // speed cap
      const sp = Math.hypot(puck.vx, puck.vy);
      if (sp > MAX_V) { const f = MAX_V / sp; puck.vx *= f; puck.vy *= f; }

      // side walls
      if (puck.x < PUCK_R) { puck.x = PUCK_R; puck.vx = Math.abs(puck.vx) * 0.95; hitSound(4, 220); }
      if (puck.x > W - PUCK_R) { puck.x = W - PUCK_R; puck.vx = -Math.abs(puck.vx) * 0.95; hitSound(4, 220); }

      // end walls, open at the goals
      const inGoal = Math.abs(puck.x - W / 2) < GOAL_HALF - 2;
      if (!inGoal) {
        if (puck.y < PUCK_R) { puck.y = PUCK_R; puck.vy = Math.abs(puck.vy) * 0.95; hitSound(4, 220); }
        if (puck.y > H - PUCK_R) { puck.y = H - PUCK_R; puck.vy = -Math.abs(puck.vy) * 0.95; hitSound(4, 220); }
      }
    }
    // gentle friction
    const fr = Math.pow(0.997, dt);
    puck.vx *= fr; puck.vy *= fr;
    for (const p of pads) { p.vx = p.vy = 0; }

    if (puck.y < -PUCK_R) goal(1);
    else if (puck.y > H + PUCK_R) goal(0);
  }

  // ---- drawing ----
  function drawRink() {
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = C.line;
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 62, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H / 2, 6, 0, Math.PI * 2); ctx.fillStyle = C.line; ctx.fill();
    // goal creases
    ctx.beginPath(); ctx.arc(W / 2, 0, GOAL_HALF + 22, 0, Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(W / 2, H, GOAL_HALF + 22, Math.PI, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;

    // goal openings
    ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.strokeStyle = C.top; ctx.shadowColor = C.top; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.moveTo(W / 2 - GOAL_HALF, 2); ctx.lineTo(W / 2 + GOAL_HALF, 2); ctx.stroke();
    ctx.strokeStyle = C.bottom; ctx.shadowColor = C.bottom;
    ctx.beginPath(); ctx.moveTo(W / 2 - GOAL_HALF, H - 2); ctx.lineTo(W / 2 + GOAL_HALF, H - 2); ctx.stroke();
    ctx.shadowBlur = 0;

    // border
    ctx.strokeStyle = C.line; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(W / 2 - GOAL_HALF, 0);
    ctx.moveTo(W / 2 + GOAL_HALF, 0); ctx.lineTo(W, 0); ctx.lineTo(W, H);
    ctx.lineTo(W / 2 + GOAL_HALF, H);
    ctx.moveTo(W / 2 - GOAL_HALF, H); ctx.lineTo(0, H); ctx.lineTo(0, 0);
    ctx.stroke();

    // scores
    ctx.font = '800 96px "Trebuchet MS", system-ui, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = C.top;
    ctx.save(); ctx.translate(W / 2, H / 2 - 120); ctx.rotate(Math.PI);
    ctx.fillText(score[0], 0, 0); ctx.restore();
    ctx.fillStyle = C.bottom;
    ctx.fillText(score[1], W / 2, H / 2 + 120);
    ctx.globalAlpha = 1;
  }

  function drawPaddle(p, col) {
    ctx.shadowColor = col; ctx.shadowBlur = 20;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(p.x, p.y, PAD_R, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(8,13,26,0.55)';
    ctx.beginPath(); ctx.arc(p.x, p.y, PAD_R * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(p.x, p.y, PAD_R * 0.3, 0, Math.PI * 2); ctx.fill();
  }

  function draw() {
    drawRink();
    drawPaddle(pads[0], C.top);
    drawPaddle(pads[1], C.bottom);
    ctx.shadowColor = C.puck; ctx.shadowBlur = 14;
    ctx.fillStyle = C.puck;
    ctx.beginPath(); ctx.arc(puck.x, puck.y, PUCK_R, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    if (flash > 0 && lastScorer >= 0) {
      ctx.globalAlpha = flash * 0.35;
      ctx.fillStyle = lastScorer === 0 ? C.top : C.bottom;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      if (state === 'goal' || state === 'over') {
        ctx.font = '800 64px "Trebuchet MS", system-ui, sans-serif';
        ctx.fillStyle = '#fff';
        ctx.fillText('BUT !', W / 2, H / 2);
      }
    }
  }

  // ---- loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(2.5, (now - last) / 16.667);
    last = now;
    if (state === 'playing') {
      if (mode === 'cpu') aiUpdate(dt);
      step(dt);
    } else if (state === 'goal') {
      stateT += dt;
      // paddles still follow fingers during the pause
      for (const p of pads) { p.x += (p.tx - p.x) * 0.4; p.y += (p.ty - p.y) * 0.4; }
      if (stateT > 70) {
        serve(lastScorer === 0 ? 1 : 0);
        state = 'playing';
      }
    } else if (state === 'menu') {
      // idle demo: puck drifts
      puck.x = W / 2; puck.y = H / 2;
    }
    flash = Math.max(0, flash - 0.02 * dt);
    draw();
    requestAnimationFrame(frame);
  }
  renderMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
